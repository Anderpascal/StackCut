name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Business-rule validation: feature registry references, price sanity,
      # AND the affiliate placeholder guard (no "12345/67890" links can merge).
      - name: Validate data integrity
        run: npm run validate

      # Unit tests, including the affiliate "golden rule" guard (ranking must
      # never read affiliateUrl) and the freshness thresholds.
      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build
        env:
          NODE_ENV: production
